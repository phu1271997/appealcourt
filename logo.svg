<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d18"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="archClip">
      <path d="M120 160 C120 85 392 85 392 160 V420 H120 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Tribunal Arch Frame -->
  <path d="M110 420 V170 C110 80 402 80 402 170 V420" fill="none" stroke="url(#primary)" stroke-width="16" stroke-linecap="round"/>
  <line x1="86" y1="420" x2="426" y2="420" stroke="url(#primary)" stroke-width="18" stroke-linecap="round"/>

  <!-- Central Scales of Justice -->
  <!-- Center Pillar -->
  <line x1="256" y1="130" x2="256" y2="390" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="130" r="16" fill="url(#gold)"/>
  <polygon points="216,400 296,400 280,380 232,380" fill="url(#gold)"/>

  <!-- Main Balance Beam -->
  <line x1="160" y1="170" x2="352" y2="170" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>

  <!-- Left Scale Pan -->
  <line x1="180" y1="170" x2="160" y2="240" stroke="url(#primary)" stroke-width="5"/>
  <line x1="180" y1="170" x2="200" y2="240" stroke="url(#primary)" stroke-width="5"/>
  <path d="M150 240 Q180 265 210 240 Z" fill="url(#gold)"/>

  <!-- Right Scale Pan -->
  <line x1="332" y1="170" x2="312" y2="240" stroke="url(#primary)" stroke-width="5"/>
  <line x1="332" y1="170" x2="352" y2="240" stroke="url(#primary)" stroke-width="5"/>
  <path d="M302 240 Q332 265 362 240 Z" fill="url(#gold)"/>

  <!-- Gavel / Adjudication Emblem in Center -->
  <circle cx="256" cy="270" r="28" fill="#111726" stroke="url(#primary)" stroke-width="6"/>
  <path d="M246 260 L266 280 M240 266 L252 254 M260 286 L272 274" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
</svg>
